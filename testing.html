<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReliaSentry — Burn-In Chamber & Orbit Simulation</title>

<style>

  :root{
    --bg:#0a0e14;
    --panel:#131a24;
    --steel:#8b95a1;
    --steel-dark:#5a6472;
    --steel-light:#c3cad3;
    --amber:#ff9f1c;
    --green-led:#39ff8a;
    --red-led:#ff4d4d;
    --blue-screen:#0d3b52;
    --blue-glow:#4ecdf0;
    --earth-blue:#1c5c8c;
    --earth-green:#3f8f5c;
    --sat-body:#e3e7eb;
    --sat-panel:#1a3a6b;
    --star:#ffffff;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#dfe4ea;
    padding:32px 16px 64px;
  }

  h1{
    text-align:center;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.5px;
    color:#f2f5f8;
    margin:0 0 6px;
  }

  .subtitle{
    text-align:center;
    color:#7c8797;
    font-size:13px;
    margin-bottom:36px;
  }

  .scene{
    max-width:640px;
    margin:0 auto 56px;
    background:var(--panel);
    border-radius:12px;
    padding:22px 20px 26px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }

  .scene h2{
    font-size:15px;
    font-weight:600;
    color:#c3cad3;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green-led);
    box-shadow:0 0 7px rgba(57,255,138,0.5);
  }

  /* ================= BURN-IN CHAMBER ================= */

  .chamber-wrap{
    position:relative;
    display:flex;
    justify-content:center;
  }

  svg{
    overflow:visible;
  }

  .chip{
    fill:#1e2530;
    stroke:#3a4452;
    stroke-width:0.6;
  }

  .chip-glow{
    fill:#2a3242;
  }

  .tray-slot{
    fill:#0e131b;
  }

  .readout-label{
    font-size:9px;
    fill:#6f7c8c;
    font-family:'Segoe UI',sans-serif;
    letter-spacing:0.3px;
  }

  .readout-value{
    font-size:15px;
    fill:var(--blue-glow);
    font-family:'Consolas','Courier New',monospace;
    font-weight:600;
  }

  .readout-value.amber{
    fill:var(--amber);
  }

  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
  }

  button{
    background:#1c2531;
    color:#dfe4ea;
    border:1px solid #34404f;
    padding:9px 18px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    transition:
      background .15s,
      border-color .15s,
      transform .1s;
  }

  button:hover{
    background:#243040;
    border-color:#4a5972;
  }

  button:active{
    transform:scale(0.98);
  }

  button:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }

  .status-line{
    text-align:center;
    font-size:12.5px;
    color:#8b95a1;
    margin-top:12px;
    min-height:16px;
    font-family:'Consolas','Courier New',monospace;
  }

  /* ================= SATELLITE ORBIT ================= */

  .orbit-wrap{
    display:flex;
    justify-content:center;
  }

  .star{
    fill:var(--star);
  }

  .orbit-ring{
    fill:none;
    stroke:rgba(140,160,190,0.35);
    stroke-width:0.7;
  }

  /*
    IMPORTANT FIX

    Each satellite follows the same ellipse as
    the visible orbit rings.

    The ellipse is centered at:
      300,300

    Radius:
      X = 230
      Y = 90
  */

  .sat-orbit{
    transform-box:view-box;
    transform-origin:300px 300px;
  }

  .sat-orbit-1{
    animation:orbit1 14s linear infinite;
  }

  .sat-orbit-2{
    animation:orbit2 20s linear infinite;
  }

  .sat-orbit-3{
    animation:orbit3 9s linear infinite;
  }

  @keyframes orbit1{

    0%{
      transform:rotate(0deg);
    }

    100%{
      transform:rotate(360deg);
    }

  }

  @keyframes orbit2{

    0%{
      transform:rotate(60deg);
    }

    100%{
      transform:rotate(-300deg);
    }

  }

  @keyframes orbit3{

    0%{
      transform:rotate(120deg);
    }

    100%{
      transform:rotate(480deg);
    }

  }

</style>

</head>

<script>

/* ============================================================
   CONSTANTS
============================================================ */

const NS = 'http://www.w3.org/2000/svg';


/* ============================================================
   STARS
============================================================ */

const starsG = document.getElementById('stars');

for(let i = 0; i < 90; i++){

  const x = Math.random() * 560;
  const y = Math.random() * 560;
  const r = Math.random() * 1.3 + 0.3;

  const c =
    document.createElementNS(NS, 'circle');

  c.setAttribute('cx', x);
  c.setAttribute('cy', y);
  c.setAttribute('r', r);
  c.setAttribute('class', 'star');

  c.setAttribute(
    'opacity',
    (Math.random() * 0.7 + 0.3).toFixed(2)
  );

  starsG.appendChild(c);

}


/* ============================================================
   BURN-IN CHAMBER — EMPTY TRAY SLOTS
============================================================ */

const slotRows =
  document.getElementById('slotRows');

for(let r = 0; r < 8; r++){

  const rect =
    document.createElementNS(NS, 'rect');

  rect.setAttribute('x', 66);
  rect.setAttribute('y', 58 + r * 29);
  rect.setAttribute('width', 214);
  rect.setAttribute('height', 22);
  rect.setAttribute('rx', 2);
  rect.setAttribute('class', 'tray-slot');
  rect.setAttribute('stroke', '#1c222a');
  rect.setAttribute('stroke-width', '1');

  slotRows.appendChild(rect);

}


/* ============================================================
   CHIP GRID
============================================================ */

const chipsOnTray =
  document.getElementById('chipsOnTray');

const cols = 18;
const rows = 3;

for(let r = 0; r < rows; r++){

  for(let c = 0; c < cols; c++){

    const x = -88 + c * 10;
    const y = -9 + r * 7;

    const rect =
      document.createElementNS(NS, 'rect');

    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', 7);
    rect.setAttribute('height', 5);
    rect.setAttribute('rx', 0.6);
    rect.setAttribute('class', 'chip');

    chipsOnTray.appendChild(rect);

  }

}


/* ============================================================
   DOM REFERENCES
============================================================ */

const trayGroup =
  document.getElementById('trayGroup');

const doorGroup =
  document.getElementById('doorGroup');

const doorPanel =
  document.getElementById('doorPanel');

const heatGlow =
  document.getElementById('heatGlow');

const tempReadout =
  document.getElementById('tempReadout');

const voltReadout =
  document.getElementById('voltReadout');

const progressBar =
  document.getElementById('progressBar');

const progressLabel =
  document.getElementById('progressLabel');

const ledGreen =
  document.getElementById('ledGreen');

const ledYellow =
  document.getElementById('ledYellow');

const ledRed =
  document.getElementById('ledRed');

const statusLine =
  document.getElementById('statusLine');

const statusDot =
  document.getElementById('statusDot');

const btnLoad =
  document.getElementById('btnLoad');

const btnClose =
  document.getElementById('btnClose');

const btnReset =
  document.getElementById('btnReset');


/* ============================================================
   ANIMATION HELPERS
============================================================ */

function easeInOut(t){

  return t < 0.5
    ? 2 * t * t
    : 1 - Math.pow(-2 * t + 2, 2) / 2;

}


/* ============================================================
   TRAY ANIMATION
============================================================ */

function animateTray(fromX, toX, duration){

  const start = performance.now();

  return new Promise(resolve => {

    function step(now){

      const t =
        Math.min(
          1,
          (now - start) / duration
        );

      const eased =
        easeInOut(t);

      const x =
        fromX +
        (toX - fromX) * eased;

      trayGroup.setAttribute(
        'transform',
        `translate(${x},180)`
      );

      if(t < 1){

        requestAnimationFrame(step);

      }else{

        resolve();

      }

    }

    requestAnimationFrame(step);

  });

}


/* ============================================================
   DOOR ANIMATION
============================================================ */

function animateDoor(fromScale, toScale, duration){

  const start = performance.now();

  return new Promise(resolve => {

    function step(now){

      const t =
        Math.min(
          1,
          (now - start) / duration
        );

      const eased =
        easeInOut(t);

      const scale =
        fromScale +
        (toScale - fromScale) * eased;

      doorPanel.setAttribute(
        'transform',
        `scale(${scale},1)`
      );

      if(t < 1){

        requestAnimationFrame(step);

      }else{

        resolve();

      }

    }

    requestAnimationFrame(step);

  });

}


/* ============================================================
   LOAD LOT
============================================================ */

btnLoad.addEventListener(
  'click',
  async () => {

    btnLoad.disabled = true;

    statusLine.textContent =
      'Loading lot RS-2291 (1,000 chips) onto tray...';

    await animateTray(
      560,
      175,
      1400
    );

    statusLine.textContent =
      'Lot loaded. Tray seated in chamber cavity.';

    btnClose.disabled = false;
    btnReset.disabled = false;

  }
);


/* ============================================================
   CLOSE DOOR + START BURN-IN
============================================================ */

btnClose.addEventListener(
  'click',
  async () => {

    btnClose.disabled = true;

    statusLine.textContent =
      'Closing chamber door...';


    await animateDoor(
      0.03,
      1,
      1100
    );


    statusLine.textContent =
      'Door sealed. Beginning burn-in cycle at 125°C.';

    statusDot.style.background =
      'var(--amber)';

    statusDot.style.boxShadow =
      '0 0 8px rgba(255,159,28,0.6)';


    ledGreen.setAttribute(
      'fill',
      '#1a4a2e'
    );


    ledYellow.setAttribute(
      'fill',
      '#ffb703'
    );


    runBurnIn();

  }
);


/* ============================================================
   BURN-IN CYCLE
============================================================ */

let burnInAnimation = null;

function runBurnIn(){

  const durationMs = 9000;

  const start = performance.now();

  heatGlow.style.transition =
    'opacity 2s';

  heatGlow.style.opacity =
    '0.18';


  function step(now){

    const t =
      Math.min(
        1,
        (now - start) / durationMs
      );


    /* 168 hours compressed into 9 seconds */

    const hours =
      Math.round(t * 168);


    /* Temperature */

    const temp =
      25 + t * 100;


    /* Voltage */

    const voltPct =
      Math.min(
        100,
        t * 115
      );


    /* Update display */

    tempReadout.textContent =
      temp.toFixed(0) + '°C';

    voltReadout.textContent =
      voltPct.toFixed(0) + '%';


    /* Progress */

    progressBar.setAttribute(
      'width',
      (98 * t).toFixed(1)
    );

    progressLabel.textContent =
      hours + 'h / 168h ELAPSED';


    if(t < 1){

      burnInAnimation =
        requestAnimationFrame(step);

    }else{

      burnInAnimation = null;

      finishBurnIn();

    }

  }


  burnInAnimation =
    requestAnimationFrame(step);

}


/* ============================================================
   BURN-IN COMPLETE
============================================================ */

function finishBurnIn(){

  ledYellow.setAttribute(
    'fill',
    '#4a3d10'
  );

  ledGreen.setAttribute(
    'fill',
    'var(--green-led)'
  );

  ledRed.setAttribute(
    'fill',
    '#4a1414'
  );


  statusDot.style.background =
    'var(--green-led)';

  statusDot.style.boxShadow =
    '0 0 8px rgba(57,255,138,0.6)';


  heatGlow.style.opacity =
    '0.08';


  statusLine.textContent =
    'Cycle complete — 168h checkpoint reached. Ready for Module A/B analysis.';


  btnReset.disabled = false;

}


/* ============================================================
   RESET
============================================================ */

btnReset.addEventListener(
  'click',
  () => {


    /* Stop burn-in animation */

    if(burnInAnimation !== null){

      cancelAnimationFrame(
        burnInAnimation
      );

      burnInAnimation = null;

    }


    /* ================= TRAY ================= */

    trayGroup.setAttribute(
      'transform',
      'translate(560,180)'
    );


    /* ================= DOOR ================= */

    doorGroup.setAttribute(
      'transform',
      'translate(58,50)'
    );

    doorPanel.setAttribute(
      'transform',
      'scale(0.03,1)'
    );


    /* ================= HEAT ================= */

    heatGlow.style.transition =
      'opacity .3s';

    heatGlow.style.opacity =
      '0';


    /* ================= READOUTS ================= */

    tempReadout.textContent =
      '25°C';

    voltReadout.textContent =
      '0%';


    /* ================= PROGRESS ================= */

    progressBar.setAttribute(
      'width',
      '0'
    );

    progressLabel.textContent =
      '0h / 168h ELAPSED';


    /* ================= LEDS ================= */

    ledGreen.setAttribute(
      'fill',
      '#1a4a2e'
    );

    ledYellow.setAttribute(
      'fill',
      '#4a3d10'
    );

    ledRed.setAttribute(
      'fill',
      '#4a1414'
    );


    /* ================= STATUS ================= */

    statusDot.style.background =
      'var(--green-led)';

    statusDot.style.boxShadow =
      '0 0 7px rgba(57,255,138,0.5)';


    statusLine.textContent =
      'Chamber idle — tray retracted, door open.';


    /* ================= BUTTONS ================= */

    btnLoad.disabled = false;
    btnClose.disabled = true;
    btnReset.disabled = true;

  }
);

</script>
